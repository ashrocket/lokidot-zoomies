name: Windows preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['windows/**', 'Resources/Characters/**', '.github/workflows/windows.yml']
  push:
    branches: [main, codex/windows-desktop, codex/vampire-and-updates]
    paths: ['windows/**', 'Resources/Characters/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained ZIP and MSI
        shell: pwsh
        run: ./windows/build.ps1
      - name: Validate packs, motion, rendering and MSI lifecycle
        shell: pwsh
        run: ./windows/test-installer.ps1
      - name: Preserve validation and installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-evidence
          path: windows/artifacts/runs/**/evidence/**
          if-no-files-found: warn
      - name: Publish preview downloads
        uses: actions/upload-artifact@v4
        with:
          name: LokiDot-Zoomies-win-x64
          path: |
            windows/artifacts/LokiDot-Zoomies-win-x64.zip
            windows/artifacts/LokiDot-Zoomies-win-x64.msi
            windows/artifacts/SHA256.txt
          if-no-files-found: error
